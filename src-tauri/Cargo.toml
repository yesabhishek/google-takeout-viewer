[package]
name = "takeout-viewer"
version = "0.2.0"
description = "Fast, private, read-only viewer for Google Photos Takeout exports"
authors = ["Abhishek Choudhury"]
homepage = "https://abhishekchoudhury.com"
repository = "https://github.com/yesabhishek/google-takeout-viewer"
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "takeout_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
rayon = "1"
kamadak-exif = "0.6"
imagesize = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = "0.4"
filetime = "0.2"
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Proc macros and build scripts run on the build machine and are never shipped.
# Stripping them makes newer macOS refuse to load them ("mis-aligned LINKEDIT").
[profile.release.build-override]
strip = false

[profile.dev.package."*"]
opt-level = 2

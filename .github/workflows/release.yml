# Builds the macOS and Windows apps.
#   - Push a tag like v0.2.0 to build both and attach them to a draft GitHub Release.
#   - Run it by hand (Actions → Release → Run workflow) to build without releasing;
#     the installers are uploaded as workflow artifacts instead.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            rust-targets: ""
            args: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - run: npm ci

      - name: Build and attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Takeout Viewer ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ### Downloads
            - **macOS 13+** (Apple Silicon and Intel): `Takeout.Viewer_*_universal.dmg`
            - **Windows 10/11** (preview): `Takeout.Viewer_*_x64-setup.exe`

            These builds aren't signed yet, so your OS will warn the first time you open them:
            - **macOS:** open the app once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
            - **Windows:** on the SmartScreen prompt, click **More info → Run anyway**.

            Windows is an early preview and hasn't been tested much yet. For iPhone photos, install Microsoft's free **HEIF Image Extensions** from the Microsoft Store; without it, HEIC files don't preview.

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: takeout-viewer-${{ matrix.os }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
